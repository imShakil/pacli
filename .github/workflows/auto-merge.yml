name: Auto Merge PR

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check PR status
        uses: actions/github-script@v7.1.0
        id: checks
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            if (pr.data.mergeable_state !== 'clean') {
              core.setFailed('PR not mergeable');
            }

      - name: Wait for status checks
        uses: actions/github-script@v7.1.0
        id: wait-for-checks
        with:
          script: |
            const MAX_RETRIES = 10;
            const INTERVAL_MS = 30000; // 30 seconds

            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
              });

              const relevant = checks.check_runs.filter(c => c.name !== context.workflow);
              const allDone = relevant.every(c => c.status === 'completed');
              const allPassed = relevant.every(c => c.conclusion === 'success' || c.conclusion === 'skipped' || c.conclusion === 'neutral');

              console.log(`Attempt ${attempt}/${MAX_RETRIES} — checks done: ${allDone}, passed: ${allPassed}`);

              if (allDone && allPassed) {
                console.log('All checks passed.');
                return;
              }

              if (allDone && !allPassed) {
                const failed = relevant
                  .filter(c => c.conclusion !== 'success' && c.conclusion !== 'skipped' && c.conclusion !== 'neutral')
                  .map(c => `${c.name} (${c.conclusion})`)
                  .join(', ');
                core.setFailed(`Some checks failed: ${failed}`);
                return;
              }

              if (attempt < MAX_RETRIES) {
                await new Promise(resolve => setTimeout(resolve, INTERVAL_MS));
              }
            }

            core.setFailed('Timed out waiting for status checks to complete.');

      - name: Verify required label
        uses: actions/github-script@v7.1.0
        id: verify-label
        with:
          script: |
            const REQUIRED_LABEL = 'auto-merge';

            const labels = context.payload.pull_request.labels.map(l => l.name);
            console.log('PR labels:', labels);

            if (!labels.includes(REQUIRED_LABEL)) {
              console.log(`Label "${REQUIRED_LABEL}" not present — skipping auto-merge.`);
              core.setOutput('should_merge', 'false');
            } else {
              core.setOutput('should_merge', 'true');
            }

      - name: Merge PR
        if: steps.verify-label.outputs.should_merge == 'true'
        uses: actions/github-script@v7.1.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            if (pr.data.mergeable_state !== 'clean') {
              core.setFailed(`PR is no longer mergeable (state: ${pr.data.mergeable_state}). Aborting.`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
              commit_title: `${pr.data.title} (#${pr.data.number})`,
              commit_message: pr.data.body ?? '',
            });

            console.log(`PR #${pr.data.number} successfully merged.`);

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7.1.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `⚠️ **Auto-merge failed.** Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
            });
